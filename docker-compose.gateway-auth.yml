services:
  redis:
    image: redis:7-alpine
    container_name: geo-demo-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: ./gateway
    container_name: geo-demo-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  admin-api:
    build: ./admin-api
    container_name: geo-demo-admin-api
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"