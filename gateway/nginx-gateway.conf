worker_processes  1;
error_log         /dev/stderr warn;
pid                /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    lua_shared_dict rules_cache 10m;
    lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/openresty/site/lualib/?.lua;;";

    resolver 127.0.0.11 ipv6=off;  # Docker's embedded DNS

    # Trust the X-Real-IP header set by your host NGINX (which is what will
    # actually be connecting to this container), instead of using the raw
    # connection IP (which will just be host NGINX's own IP, e.g. 127.0.0.1).
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    init_by_lua_block {
        local maxminddb = require "resty.maxminddb"
        maxminddb.init("/etc/openresty/geoip/GeoLite2-Country.mmdb")
    }

    server {
        listen 8080;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Check-only endpoint used by host NGINX's auth_request.
        # Returns 200 if the request passes IP/GeoIP rules, or the Lua
        # script calls ngx.exit(403) itself if it doesn't — either way,
        # no proxy_pass here, nothing forwarded, no real traffic touched.
        location = /geo-check {
            access_by_lua_file /etc/openresty/lua/access_control.lua;
            return 200;
        }

        # Kept for the repo's original mode (gateway proxies traffic itself).
        # Not used if you're doing the auth_request pattern from host NGINX,
        # but harmless to leave in for direct testing against the gateway.
        location / {
            access_by_lua_file /etc/openresty/lua/access_control.lua;

            proxy_pass http://host.docker.internal:8110;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}