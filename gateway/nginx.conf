worker_processes  1;
error_log         /dev/stderr warn;
pid                /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    lua_shared_dict rules_cache 10m;
    lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/openresty/site/lualib/?.lua;;";

    resolver 127.0.0.11 ipv6=off;  # Docker's embedded DNS

    init_by_lua_block {
        local maxminddb = require "resty.maxminddb"
        maxminddb.init("/etc/openresty/geoip/GeoLite2-Country.mmdb")
    }

    server {
        listen 8080;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            access_by_lua_file /etc/openresty/lua/access_control.lua;

            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
